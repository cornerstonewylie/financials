<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aplos Query — Cornerstone Baptist Church</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --charcoal: #6B5D53;
    --tan: #DAC9AF;
    --dark: #1a1714;
    --mid: #252018;
    --surface: #2e2820;
    --border: #3d3528;
    --text: #ede6da;
    --muted: #8a7d6e;
    --green: #6daa7a;
    --red: #c07070;
    --blue: #7aabcc;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--mid);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--tan);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 500;
    color: var(--dark);
    flex-shrink: 0;
  }

  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header .org { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .status {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: var(--red); }

  main { max-width: 960px; margin: 0 auto; padding: 28px 24px; }

  .card {
    background: var(--mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 18px;
  }

  .card-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  input, select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
    height: 36px;
  }
  input:focus, select:focus { border-color: var(--tan); }
  select option { background: var(--surface); }

  .client-id-field { min-width: 320px; flex: 1; }

  button {
    padding: 0 18px;
    height: 36px;
    border-radius: 6px;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn-primary { background: var(--tan); color: var(--dark); }
  .btn-primary:hover { background: #c8b89e; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--tan); color: var(--text); }

  .query-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .error-box {
    background: rgba(192, 112, 112, 0.1);
    border: 1px solid rgba(192, 112, 112, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .metric .mlabel { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .metric .mvalue { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; }

  .results-card {
    background: var(--mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .results-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .results-header .rlabel {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
  }

  .results-header .rmeta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--muted);
  }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }

  th {
    background: var(--surface);
    padding: 10px 16px;
    text-align: left;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(61,53,40,0.5);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(218,201,175,0.03); }

  .pos { color: var(--green); }
  .neg { color: var(--red); }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .empty svg { margin-bottom: 14px; opacity: 0.3; }

  .loading {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--tan);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  .notice {
    font-size: 12px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 14px;
  }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: rgba(109,170,122,0.15);
    color: var(--green);
  }

  .tag.inactive {
    background: rgba(138,125,110,0.15);
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="logo">CBC</div>
  <div>
    <h1>Aplos Data Query</h1>
    <div class="org">Cornerstone Baptist Church</div>
  </div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Not connected</span>
  </div>
</header>

<main>

  <div class="card">
    <div class="card-label">Connection</div>
    <p class="notice">Credentials pre-loaded. Click Connect to authenticate with Aplos via your Cloudflare proxy.</p>
    <div class="row">
      <div class="field" style="flex:1; min-width:280px;">
        <label>CLIENT ID</label>
        <input type="text" id="clientId" value="f8ef5723-8750-4b68-90e1-951520cfee1d" readonly />
      </div>
      <div class="field">
        <label>PROXY</label>
        <input type="text" id="proxyUrl" value="https://aplos-proxy.chris-brons.workers.dev" style="min-width:320px;" />
      </div>
      <button class="btn-primary" id="connectBtn" onclick="authenticate()">Connect</button>
      <button class="btn-ghost" id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Query</div>
    <div class="query-grid">
      <div class="field">
        <label>DATA TYPE</label>
        <select id="queryType" onchange="onTypeChange()">
          <option value="transactions">Transactions</option>
          <option value="funds">Funds</option>
          <option value="accounts">Accounts</option>
          <option value="contributions">Contributions</option>
        </select>
      </div>
      <div class="field" id="dateStartWrap">
        <label>DATE FROM</label>
        <input type="date" id="dateStart" value="2026-01-01" />
      </div>
      <div class="field" id="dateEndWrap">
        <label>DATE TO</label>
        <input type="date" id="dateEnd" value="2026-03-31" />
      </div>
      <div class="field" id="fundWrap">
        <label>FUND ID (optional)</label>
        <input type="text" id="fundFilter" placeholder="e.g. 1" />
      </div>
    </div>
    <div class="row">
      <button class="btn-primary" id="runBtn" onclick="runQuery()" disabled>Run Query</button>
      <button class="btn-ghost" onclick="clearResults()">Clear</button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="summaryGrid" class="summary-grid" style="display:none;"></div>

  <div class="results-card">
    <div class="results-header">
      <span class="rlabel">Results</span>
      <span class="rmeta" id="resultsMeta"></span>
    </div>
    <div id="resultsBody">
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <div>Connect and run a query to see data</div>
      </div>
    </div>
  </div>

</main>

<script>
const CLIENT_ID = 'f8ef5723-8750-4b68-90e1-951520cfee1d';
const PRIVATE_KEY_B64 = 'MIIEvwIBADANBgkqhkiG9w0BAQEFAASCBKkwggSlAgEAAoIBAQC03aHJTPmZr7q93oD5WcZtW/VaNFW1Hbrr0Be7oVBLcuwT78FYq7N8fp2XWWbdu6TantHmSapYh4SvRZNJQAfdCaA3NUgsR2BXDFXmpOTmgk85bElYdifvubaNil1duDT43niDunWJIFPIfLTnhYemU0zCLI6vg4phbWHNNn+T6WhESavYMyj1MSJkQArHncbFldYCRzuAY/3dD+fQOxN2xpKoyy14v/JkCcsH3jkP1AXBzsyKIIyIqNBTwTwnQR08CkEwgjT3ij/d1MIloAaylvO1/0JIJgJ5SqpleV4U2L+lqKrY9Iin9JLBsqnorjiGYW2D4kTsPLpzvYmZv9ZpAgMBAAECggEBAJqwhFMbFs+vUNRbnYumkOOvpuUDpdpGFzzguausiHQ/UlKq2H7yO4za7gYoXKaAerrQ401G6/7TyVPu+c3IifEu7mzJkXTthyRsVHvzxCKyiPff+ctDI10RRWVBViF2Dzhbbk+cBjLGB2KN5luuBRroW9onKdJLeuthFijh17O0l6ccHdcVpJ7bvppUQI0SbM+qSHWK4+Coll7bSRuB5/9BDpv37MRv9U0oczSQSXk6Mvn/wGMICLyblp5pa7e/KsEuUpSg4FSH970Gv93UDJuu/ie3+k4jg2IGnPdtYl8fDYBvX/9I+KHBC9IfC7Xf5m+JUBCyyuozPVpcQdIdwAECgYEA7asTCMZYSbmNxLCo9SeUOP8J76R9fgs81F/lKOB9Qa8FwgAUvyS6oKKcik2EH5RHiqy+RJdD4RkD0LqNdVoPp5c2k+vkL2R0thfSfx6IZNojwkkUYn4DKo0j31RQFM1LKDELoOzyFerV8LUGm6ImOcHLOQ7ZqYnsk3RCTQKaZgECgYEAwtDz0uam2A0RxpKs1FObBO7eqCAiTOyXiZ8jqGFN9k//KGYvPSWmwJrx3TH1tBWJnJYVlKH7+74beY0uZVUZesHsj1k+w54wry7u5JNcM7RVoDaKOSaRU24ymXVDZwAdo0vHXY/3mNEPvJ22f0N2v4F8nLnbcslNbq1f0IBsAGkCgYAPGrEx/JD91noJBwUl12cXHDZAcZ68FPC/unxw1ZuAQiRGiQTIhQgLT2pNa9G6xAyr5oCNEWPx+UoByOlWjOuzxetlCTfOPz8fl3H8PC+E4Uwme8h83e9Lk/60ocIZIFbnbf6EMqrL88m263pJB8wQHZ3RuXzhxm8vi9Lu2/x+AQKBgQCZ5SynbvNf+rsPDXEf7ceo1vXnBDN0ZvWyjpdBfVRz/m/HPymT+TlIL15e6Qd6sgTaQKldl7SSAnR7ye5buCT/l0/DUbHGICG/Uaj/wfT1F0EI5ey9Bt2IdaXdGggbxrii9crQ+1iRTJ1M152B3Q5ia+y/dgaIH8NeafElqT0n+QKBgQC6yLRPYL2BOQsHN8GgtedWz/R2kxy7HPdsK9pqn0CUyV2u6mZ6d98S7sTStoIrj+1aosJR72atBuhIpM5zlfL1FZkGOH21yfmzayQbpWpXefMqKk5ROVR+5wHDPqtDCMfQARAS+n4WcMlooNeN5xH8HsMY9IYj5QEGMewCYEwdsA==';

let token = null;

function proxy() { return document.getElementById('proxyUrl').value.replace(/\/$/, ''); }

function setStatus(state, text) {
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (state === 'on' ? ' on' : state === 'err' ? ' err' : '');
  document.getElementById('statusText').textContent = text;
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.style.display = 'block';
  b.textContent = '⚠ ' + msg;
}

function hideError() { document.getElementById('errorBox').style.display = 'none'; }

function onTypeChange() {
  const t = document.getElementById('queryType').value;
  const dates = t === 'transactions' || t === 'contributions';
  document.getElementById('dateStartWrap').style.display = dates ? '' : 'none';
  document.getElementById('dateEndWrap').style.display = dates ? '' : 'none';
  document.getElementById('fundWrap').style.display = t === 'transactions' ? '' : 'none';
}

async function authenticate() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = 'Connecting...';
  setStatus('', 'Authenticating...'); hideError();

  try {
    const resp = await fetch(`${proxy()}/aplos/auth/${CLIENT_ID}`);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const encB64 = data?.data?.token;
    if (!encB64) throw new Error('No token in response: ' + JSON.stringify(data));

    const keyBytes = Uint8Array.from(atob(PRIVATE_KEY_B64), c => c.charCodeAt(0));
    const privateKey = await crypto.subtle.importKey(
      'pkcs8', keyBytes.buffer,
      { name: 'RSA-OAEP', hash: 'SHA-1' }, false, ['decrypt']
    );
    const encBytes = Uint8Array.from(atob(encB64), c => c.charCodeAt(0));
    const decrypted = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, privateKey, encBytes);
    token = new TextDecoder().decode(decrypted);

    setStatus('on', 'Connected');
    btn.textContent = 'Reconnect'; btn.disabled = false;
    document.getElementById('disconnectBtn').disabled = false;
    document.getElementById('runBtn').disabled = false;
  } catch (err) {
    setStatus('err', 'Failed');
    btn.textContent = 'Connect'; btn.disabled = false;
    showError('Connection failed: ' + err.message);
  }
}

function disconnect() {
  token = null;
  setStatus('', 'Not connected');
  document.getElementById('connectBtn').textContent = 'Connect';
  document.getElementById('disconnectBtn').disabled = true;
  document.getElementById('runBtn').disabled = true;
  clearResults();
}

async function runQuery() {
  if (!token) { showError('Not connected.'); return; }
  hideError();
  const type = document.getElementById('queryType').value;
  const start = document.getElementById('dateStart').value;
  const end = document.getElementById('dateEnd').value;
  const fund = document.getElementById('fundFilter')?.value?.trim();

  setLoading(type);

  try {
    const params = new URLSearchParams({ page_size: '200' });
    if ((type === 'transactions' || type === 'contributions') && start) params.set('f_rangestart', start);
    if ((type === 'transactions' || type === 'contributions') && end) params.set('f_rangeend', end);
    if (type === 'transactions' && fund) params.set('f_fund', fund);

    const resp = await fetch(`${proxy()}/aplos/${type}?${params}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e?.exception?.message || 'HTTP ' + resp.status);
    }
    const data = await resp.json();
    render(type, data);
  } catch (err) {
    document.getElementById('resultsBody').innerHTML = '<div class="empty"><div>Query failed</div></div>';
    showError(err.message);
  }
}

function setLoading(type) {
  document.getElementById('summaryGrid').style.display = 'none';
  document.getElementById('summaryGrid').innerHTML = '';
  document.getElementById('resultsMeta').textContent = '';
  document.getElementById('resultsBody').innerHTML = `<div class="loading"><span class="spinner"></span>Loading ${type}...</div>`;
}

function fmt(n) { return '$' + Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function metric(label, value) {
  return `<div class="metric"><div class="mlabel">${label}</div><div class="mvalue">${value}</div></div>`;
}

function showSummary(html) {
  const g = document.getElementById('summaryGrid');
  g.innerHTML = html; g.style.display = 'grid';
}

function render(type, data) {
  const area = document.getElementById('resultsBody');
  const meta = document.getElementById('resultsMeta');

  if (type === 'transactions') {
    const rows = data?.data?.transactions || [];
    meta.textContent = rows.length + ' records';
    if (!rows.length) { area.innerHTML = empty('No transactions found'); return; }
    const total = rows.reduce((s,t)=>s+(t.amount||0),0);
    showSummary(metric('Transactions', rows.length) + metric('Total', fmt(total)));
    area.innerHTML = tbl(
      ['Date','Note / Memo','Amount','Contact'],
      rows.map(t=>[
        t.date||'—',
        t.note||t.memo||'—',
        `<span class="${(t.amount||0)>=0?'pos':'neg'}">${fmt(t.amount)}</span>`,
        t.contact?.companyname||t.contact?.name||'—'
      ])
    );
  } else if (type === 'funds') {
    const rows = data?.data?.funds || [];
    meta.textContent = rows.length + ' funds';
    if (!rows.length) { area.innerHTML = empty('No funds found'); return; }
    showSummary(metric('Funds', rows.length));
    area.innerHTML = tbl(
      ['ID','Name','Type','Balance'],
      rows.map(f=>[
        f.id, f.name, f.fund_type||'—',
        `<span class="${(f.balance||0)>=0?'pos':'neg'}">${fmt(f.balance||0)}</span>`
      ])
    );
  } else if (type === 'accounts') {
    const rows = data?.data?.accounts || [];
    meta.textContent = rows.length + ' accounts';
    if (!rows.length) { area.innerHTML = empty('No accounts found'); return; }
    showSummary(metric('Accounts', rows.length));
    area.innerHTML = tbl(
      ['#','Name','Category','Type','Active'],
      rows.map(a=>[
        a.account_number, a.name, a.category||'—', a.type||'—',
        `<span class="tag ${a.is_enabled?'':'inactive'}">${a.is_enabled?'Active':'Inactive'}</span>`
      ])
    );
  } else if (type === 'contributions') {
    const rows = data?.data?.contributions || [];
    meta.textContent = rows.length + ' contributions';
    if (!rows.length) { area.innerHTML = empty('No contributions found'); return; }
    const total = rows.reduce((s,c)=>s+(c.amount||0),0);
    showSummary(metric('Contributions', rows.length) + metric('Total', fmt(total)));
    area.innerHTML = tbl(
      ['Date','Donor','Amount','Fund'],
      rows.map(c=>[
        c.date||'—',
        c.contact?.name||c.contact?.companyname||'—',
        `<span class="pos">${fmt(c.amount||0)}</span>`,
        c.fund?.name||'—'
      ])
    );
  }
}

function tbl(headers, rows) {
  const ths = headers.map(h=>`<th>${h}</th>`).join('');
  const trs = rows.map(cells=>'<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  return `<div class="table-wrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function empty(msg) {
  return `<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg><div>${msg}</div></div>`;
}

function clearResults() {
  hideError();
  document.getElementById('summaryGrid').style.display = 'none';
  document.getElementById('summaryGrid').innerHTML = '';
  document.getElementById('resultsMeta').textContent = '';
  document.getElementById('resultsBody').innerHTML = '<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><div>Connect and run a query to see data</div></div>';
}

onTypeChange();
</script>
</body>
</html>
