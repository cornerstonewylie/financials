<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cornerstone Baptist Church — Elder Dashboard 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Design tokens (matches congregation dashboard) ── */
:root {
  --charcoal:  #6B5D53;
  --tan:       #DAC9AF;
  --cream:     #FDFAF6;
  --ink:       #2C2420;
  --muted:     #8C7B72;
  --border:    #E8DDD1;
  --green:     #3A7D44;
  --yellow:    #B8860B;
  --red:       #B53A2F;
  --green-bg:  #EDF7EF;
  --yellow-bg: #FEF9EC;
  --red-bg:    #FCECEA;
  --shadow:    0 2px 12px rgba(107,93,83,.10);
  --radius:    6px;
  --font-head: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Password gate ── */
#gate {
  position: fixed; inset: 0; z-index: 999;
  background: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 1.5rem;
}
#gate h1 {
  font-family: var(--font-head);
  color: var(--tan);
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  letter-spacing: .04em;
  text-align: center;
}
#gate p { color: #c7b89e; font-size: .85rem; text-align: center; max-width: 280px; }
#gate form { display: flex; flex-direction: column; gap: .75rem; width: 260px; }
#gate input {
  padding: .65rem 1rem;
  border: 1px solid #8c7b72;
  border-radius: var(--radius);
  background: #3d322b;
  color: var(--tan);
  font-family: var(--font-body);
  font-size: .95rem;
  outline: none;
  letter-spacing: .15em;
  text-align: center;
}
#gate input:focus { border-color: var(--tan); }
#gate button {
  padding: .65rem 1rem;
  background: var(--tan);
  border: none;
  border-radius: var(--radius);
  color: var(--charcoal);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: .9rem;
  cursor: pointer;
  letter-spacing: .04em;
}
#gate button:hover { background: #c9b59a; }
#gate-error { color: #e07070; font-size: .8rem; text-align: center; min-height: 1.2em; }

/* ── App shell ── */
#app { display: none; }

/* ── Top bar ── */
header {
  background: var(--charcoal);
  padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
header h1 {
  font-family: var(--font-head);
  color: var(--tan);
  font-size: 1.35rem;
  letter-spacing: .04em;
  font-weight: 600;
}
header h1 span { font-style: italic; font-weight: 400; opacity: .7; }

.period-tabs {
  display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
}
.period-tabs button {
  padding: .3rem .85rem;
  border: 1px solid rgba(218,201,175,.35);
  border-radius: 20px;
  background: transparent;
  color: var(--tan);
  font-family: var(--font-body);
  font-size: .8rem;
  cursor: pointer;
  letter-spacing: .04em;
  transition: all .15s;
}
.period-tabs button:hover, .period-tabs button.active {
  background: var(--tan);
  color: var(--charcoal);
  border-color: var(--tan);
}

.header-right { display: flex; align-items: center; gap: 1rem; }
#last-updated { color: #9c8c83; font-size: .75rem; }
#refresh-btn {
  background: none; border: 1px solid rgba(218,201,175,.3);
  color: var(--tan); border-radius: var(--radius);
  padding: .3rem .7rem; font-size: .78rem; cursor: pointer;
  font-family: var(--font-body); transition: all .15s;
}
#refresh-btn:hover { background: rgba(218,201,175,.1); }

/* ── Main layout ── */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 4rem;
  display: flex; flex-direction: column; gap: 2rem;
}

/* ── Section headers ── */
.section-title {
  font-family: var(--font-head);
  font-size: 1.4rem;
  color: var(--charcoal);
  letter-spacing: .03em;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1rem;
}

/* ── Summary cards ── */
.summary-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  box-shadow: var(--shadow);
}
.card-label {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: .35rem;
}
.card-value {
  font-family: var(--font-head);
  font-size: 1.9rem;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: .01em;
}
.card-value.positive { color: var(--green); }
.card-value.negative { color: var(--red); }
.card-sub { font-size: .75rem; color: var(--muted); margin-top: .25rem; }

/* ── Tables ── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: #fff;
}
table {
  width: 100%; border-collapse: collapse; font-size: .82rem;
}
thead th {
  background: var(--cream);
  padding: .6rem 1rem;
  text-align: left;
  font-weight: 500;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--charcoal); }
thead th.sorted { color: var(--charcoal); }
thead th.sorted::after { content: " ↓"; }
thead th.sorted.asc::after { content: " ↑"; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #faf7f3; }
td { padding: .55rem 1rem; vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.neg { color: var(--red); }
td.pos { color: var(--green); }

/* ── Group rows ── */
tr.group-header td {
  background: var(--cream);
  font-weight: 600;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--charcoal);
  padding: .5rem 1rem;
}

/* ── Status badges ── */
.badge {
  display: inline-block;
  padding: .15rem .5rem;
  border-radius: 12px;
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .04em;
}
.badge.green  { background: var(--green-bg);  color: var(--green); }
.badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge.red    { background: var(--red-bg);    color: var(--red); }
.badge.none   { background: var(--border);    color: var(--muted); }

/* ── Progress bar ── */
.progress-wrap { width: 80px; display: inline-block; vertical-align: middle; }
.progress-bg {
  height: 5px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px; transition: width .4s;
}
.progress-fill.green  { background: var(--green); }
.progress-fill.yellow { background: var(--yellow); }
.progress-fill.red    { background: var(--red); }

/* ── Drill-down rows ── */
tr.drill-row { display: none; }
tr.drill-row.open { display: table-row; }
tr.drill-row td {
  background: #f8f5f1;
  font-size: .78rem;
  color: var(--muted);
  padding: .35rem 1rem .35rem 2.5rem;
}
tr.drill-row td.num { text-align: right; }
tr.has-drill { cursor: pointer; }
tr.has-drill td:first-child::before {
  content: "▶ "; font-size: .6rem; color: var(--muted); transition: transform .2s;
}
tr.has-drill.open td:first-child::before { content: "▼ "; }

/* ── Search ── */
.search-bar {
  display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.search-bar input {
  flex: 1; min-width: 200px;
  padding: .5rem .85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: .85rem;
  color: var(--ink);
  background: #fff;
  outline: none;
}
.search-bar input:focus { border-color: var(--charcoal); }
.search-bar select {
  padding: .48rem .75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: .82rem;
  color: var(--ink);
  background: #fff;
  outline: none;
}
.result-count { font-size: .78rem; color: var(--muted); }

/* ── Fund pills ── */
.fund-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: .75rem;
}
.fund-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  box-shadow: var(--shadow);
}
.fund-name { font-weight: 500; color: var(--ink); margin-bottom: .2rem; font-size: .85rem; }
.fund-balance {
  font-family: var(--font-head);
  font-size: 1.45rem;
  color: var(--charcoal);
}
.fund-type { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

/* ── Loading / error states ── */
#loading, #error-msg {
  text-align: center; padding: 3rem; color: var(--muted); font-size: .9rem;
}
#error-msg { color: var(--red); }
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--charcoal);
  border-radius: 50%; animation: spin .7s linear infinite;
  margin-right: .5rem; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Nav tabs ── */
.nav-tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.nav-tab {
  padding: .6rem 1.2rem;
  font-family: var(--font-body); font-size: .82rem; font-weight: 500;
  color: var(--muted); background: none; border: none; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  white-space: nowrap; transition: all .15s;
  letter-spacing: .02em;
}
.nav-tab:hover { color: var(--charcoal); }
.nav-tab.active { color: var(--charcoal); border-bottom-color: var(--charcoal); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Responsive ── */
@media (max-width: 640px) {
  header { padding: .75rem 1rem; }
  main { padding: 1rem .75rem 3rem; }
  .period-tabs button { font-size: .72rem; padding: .25rem .6rem; }
}
</style>
</head>
<body>

<!-- ══════════════════ PASSWORD GATE ══════════════════ -->
<div id="gate">
  <h1>CORNERSTONE<br/><span>Elder Dashboard</span></h1>
  <p>This dashboard contains detailed financial information for elders and the Finance Committee.</p>
  <form id="gate-form">
    <input type="password" id="gate-pw" placeholder="Passphrase" autocomplete="off" autofocus/>
    <button type="submit">Enter</button>
    <div id="gate-error"></div>
  </form>
  <p style="font-size:.72rem;color:#5c4f48;">1 Corinthians 4:2</p>
</div>

<!-- ══════════════════ MAIN APP ══════════════════ -->
<div id="app">

<header>
  <h1>CORNERSTONE <span>· Elder Dashboard 2026</span></h1>
  <div class="period-tabs">
    <button class="period-btn" data-period="q1">Q1</button>
    <button class="period-btn" data-period="q2">Q2</button>
    <button class="period-btn" data-period="q3">Q3</button>
    <button class="period-btn" data-period="q4">Q4</button>
    <button class="period-btn active" data-period="full">Full Year</button>
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <button id="refresh-btn">↻ Refresh</button>
  </div>
</header>

<main>

  <div id="loading"><span class="spinner"></span>Loading live data from Aplos…</div>
  <div id="error-msg" style="display:none"></div>

  <div id="content" style="display:none">

    <!-- ── Summary Cards ── -->
    <div class="summary-cards" id="summary-cards"></div>

    <!-- ── Nav Tabs ── -->
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="pnl">P&amp;L</button>
      <button class="nav-tab" data-tab="budget">Budget vs Actual</button>
      <button class="nav-tab" data-tab="giving">Giving by Fund</button>
      <button class="nav-tab" data-tab="reserves">Reserves</button>
      <button class="nav-tab" data-tab="register">Transaction Register</button>
    </div>

    <!-- ── P&L Tab ── -->
    <div class="tab-panel active" id="tab-pnl">
      <div id="pnl-content"></div>
    </div>

    <!-- ── Budget vs Actual Tab ── -->
    <div class="tab-panel" id="tab-budget">
      <div id="budget-content"></div>
    </div>

    <!-- ── Giving by Fund Tab ── -->
    <div class="tab-panel" id="tab-giving">
      <div id="giving-content"></div>
    </div>

    <!-- ── Reserves Tab ── -->
    <div class="tab-panel" id="tab-reserves">
      <div id="reserves-content"></div>
    </div>

    <!-- ── Register Tab ── -->
    <div class="tab-panel" id="tab-register">
      <div class="search-bar">
        <input type="text" id="reg-search" placeholder="Search memo, fund, account, vendor…"/>
        <select id="reg-type">
          <option value="">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select id="reg-fund"><option value="">All funds</option></select>
        <span class="result-count" id="reg-count"></span>
      </div>
      <div id="register-content"></div>
    </div>

  </div><!-- /content -->
</main>
</div><!-- /app -->

<script>
const PROXY = "https://aplos-proxy.chris-brons.workers.dev";
const PASSWORD = "1cor42";

let DATA = null;
let currentPeriod = "full";
let registerData  = [];

// ── Format helpers ──
const fmt = (n, opts = {}) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0, ...opts }).format(n);
const pct = n => n == null ? "—" : (n * 100).toFixed(1) + "%";
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";

function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

// ── Gate ──────────────────────────────────────────────────────────────────────
document.getElementById("gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const pw = document.getElementById("gate-pw").value.trim().toLowerCase();
  if (pw === PASSWORD) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display  = "block";
    loadData();
  } else {
    document.getElementById("gate-error").textContent = "Incorrect passphrase.";
    document.getElementById("gate-pw").value = "";
  }
});

// ── Period tabs ───────────────────────────────────────────────────────────────
document.querySelectorAll(".period-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentPeriod = btn.dataset.period;
    loadData();
  });
});

// ── Refresh ───────────────────────────────────────────────────────────────────
document.getElementById("refresh-btn").addEventListener("click", loadData);

// ── Nav tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll(".nav-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
  });
});

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  const loading = document.getElementById("loading");
  const content = document.getElementById("content");
  const errEl   = document.getElementById("error-msg");

  loading.style.display = "block";
  content.style.display = "none";
  errEl.style.display   = "none";

  try {
    const url = `${PROXY}/dashboard-data?year=2026&period=${currentPeriod}&_=${Date.now()}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();

    document.getElementById("last-updated").textContent =
      "Updated " + new Date(DATA.generated).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

    render();
    loading.style.display = "none";
    content.style.display = "block";
  } catch (err) {
    loading.style.display = "none";
    errEl.style.display   = "block";
    errEl.innerHTML = `<strong>Error loading data:</strong> ${err.message}<br><small>Check that the Cloudflare Worker is deployed and the Aplos credentials are valid.</small>`;
  }
}

// ── Render all sections ───────────────────────────────────────────────────────
function render() {
  renderSummary();
  renderPnL();
  renderBudget();
  renderGiving();
  renderReserves();
  renderRegister();
}

// ── Summary cards ─────────────────────────────────────────────────────────────
function renderSummary() {
  const { totalIncome, totalExpenses, netIncome, priorIncome, priorExpenses, priorNetIncome } = DATA.summary;
  const periodLabel = { q1:"Q1", q2:"Q2", q3:"Q3", q4:"Q4", full:"Full Year" }[currentPeriod] ?? "";
  const priorLabel  = periodLabel + " 2025";

  const totalReserves = (DATA.funds ?? []).reduce((s, f) => s + (f.balance ?? 0), 0);
  const restricted    = (DATA.funds ?? []).filter(f => f.type === "restricted").reduce((s, f) => s + f.balance, 0);

  function yoyBadge(curr, prior) {
    if (!prior) return "";
    const chg = curr - prior;
    const pct = ((chg / prior) * 100).toFixed(1);
    const dir = chg >= 0 ? "▲" : "▼";
    const cls = chg >= 0 ? "positive" : "negative";
    return `<div class="card-sub ${cls}">${dir} ${Math.abs(pct)}% vs ${priorLabel} (${fmt(prior)})</div>`;
  }

  document.getElementById("summary-cards").innerHTML = `
    <div class="card">
      <div class="card-label">Total Income · ${periodLabel} 2026</div>
      <div class="card-value positive">${fmt(totalIncome)}</div>
      ${yoyBadge(totalIncome, priorIncome)}
    </div>
    <div class="card">
      <div class="card-label">Total Expenses · ${periodLabel} 2026</div>
      <div class="card-value">${fmt(totalExpenses)}</div>
      ${yoyBadge(totalExpenses, priorExpenses)}
    </div>
    <div class="card">
      <div class="card-label">Net Income · ${periodLabel} 2026</div>
      <div class="card-value ${netIncome >= 0 ? "positive" : "negative"}">${fmt(netIncome)}</div>
      ${priorNetIncome ? `<div class="card-sub">vs ${fmt(priorNetIncome)} in ${priorLabel}</div>` : ""}
    </div>
    <div class="card">
      <div class="card-label">Total Church Reserves</div>
      <div class="card-value">${fmt(totalReserves)}</div>
      <div class="card-sub">${fmt(restricted)} restricted</div>
    </div>
  `;
}

// ── P&L ───────────────────────────────────────────────────────────────────────
function renderPnL() {
  const income   = [...(DATA.income   ?? [])].sort((a,b) => b.total - a.total);
  const expenses = [...(DATA.expenses ?? [])].sort((a,b) => a.account - b.account);

  // Group expenses
  const groups = {};
  expenses.forEach(e => {
    const g = e.group || "Other";
    groups[g] = groups[g] ?? [];
    groups[g].push(e);
  });

  let html = `
    <h2 class="section-title" style="margin-top:1.5rem">Income</h2>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Account</th><th>Description</th><th class="num">Amount</th>
      </tr></thead>
      <tbody>
  `;
  income.forEach((row, i) => {
    const txId = `pnl-inc-${i}`;
    html += `<tr class="has-drill" data-drill="${txId}">
      <td>${row.account}</td>
      <td>${row.name}</td>
      <td class="num pos">${fmt(row.total)}</td>
    </tr>`;
    (row.transactions ?? []).forEach(t => {
      html += `<tr class="drill-row" id="${txId}">
        <td></td><td>${fmtDate(t.date)} — ${t.memo ?? ""} <em>(${t.fund})</em></td>
        <td class="num">${fmt(t.amount)}</td>
      </tr>`;
    });
  });
  html += `<tr><td></td><td><strong>Total Income</strong></td>
    <td class="num pos"><strong>${fmt(DATA.summary.totalIncome)}</strong></td></tr>
    </tbody></table></div>

    <h2 class="section-title" style="margin-top:1.5rem">Expenses</h2>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Account</th><th>Description</th><th class="num">Amount</th>
      </tr></thead><tbody>
  `;

  Object.entries(groups).forEach(([groupName, rows]) => {
    const groupTotal = rows.reduce((s, r) => s + r.total, 0);
    html += `<tr class="group-header"><td colspan="2">${groupName}</td>
      <td class="num">${fmt(groupTotal)}</td></tr>`;
    rows.forEach((row, i) => {
      const txId = `pnl-exp-${groupName}-${i}`;
      html += `<tr class="has-drill" data-drill="${txId}">
        <td style="padding-left:1.75rem">${row.account}</td>
        <td>${row.name}</td>
        <td class="num">${fmt(row.total)}</td>
      </tr>`;
      (row.transactions ?? []).forEach(t => {
        html += `<tr class="drill-row" id="${txId}">
          <td></td>
          <td>${fmtDate(t.date)} — ${t.memo ?? ""} ${t.vendor ? `· <em>${t.vendor}</em>` : ""}</td>
          <td class="num">${fmt(t.amount)}</td>
        </tr>`;
      });
    });
  });

  html += `<tr><td></td><td><strong>Total Expenses</strong></td>
    <td class="num"><strong>${fmt(DATA.summary.totalExpenses)}</strong></td></tr>
    <tr><td></td><td><strong>Net Income</strong></td>
    <td class="num ${DATA.summary.netIncome >= 0 ? "pos" : "neg"}">
      <strong>${fmt(DATA.summary.netIncome)}</strong></td></tr>
    </tbody></table></div>
  `;

  document.getElementById("pnl-content").innerHTML = html;
  attachDrill();
}

// ── Budget vs Actual ──────────────────────────────────────────────────────────
function renderBudget() {
  const rows = [...(DATA.budgetVsActual ?? [])].sort((a, b) => {
    if (a.group !== b.group) return a.group.localeCompare(b.group);
    return a.account - b.account;
  });

  const priorLabel = { q1:"Q1 2025", q2:"Q2 2025", q3:"Q3 2025", q4:"Q4 2025", full:"2025" }[currentPeriod] ?? "Prior Year";

  let html = `<div class="table-wrap" style="margin-top:1.5rem"><table>
    <thead><tr>
      <th>Account</th><th>Description</th><th>Group</th>
      <th class="num">2026 Budget</th><th class="num">2026 Actual</th>
      <th class="num">${priorLabel}</th><th class="num">Variance</th><th>Used</th><th>Status</th>
    </tr></thead><tbody>`;

  let curGroup = null;
  rows.forEach((row, i) => {
    if (row.group !== curGroup) {
      const gRows   = rows.filter(r => r.group === row.group);
      const gBudget = gRows.reduce((s, r) => s + r.budget, 0);
      const gActual = gRows.reduce((s, r) => s + r.actual, 0);
      const gPrior  = gRows.reduce((s, r) => s + (r.priorYear ?? 0), 0);
      html += `<tr class="group-header">
        <td colspan="3">${row.group}</td>
        <td class="num">${fmt(gBudget)}</td>
        <td class="num">${fmt(gActual)}</td>
        <td class="num">${gPrior > 0 ? fmt(gPrior) : "—"}</td>
        <td class="num ${gBudget - gActual >= 0 ? "pos":"neg"}">${fmt(gBudget - gActual)}</td>
        <td colspan="2"></td>
      </tr>`;
      curGroup = row.group;
    }
    const fillPct = row.budget > 0 ? clamp(row.actual / row.budget * 100, 0, 100) : 0;
    const prior   = row.priorYear ?? 0;
    const yoyDiff = prior > 0 ? row.actual - prior : null;
    const yoyStr  = prior > 0
      ? `${fmt(prior)} <span style="font-size:.65rem;color:${yoyDiff >= 0 ? "var(--red)" : "var(--green)"}">${yoyDiff >= 0 ? "▲" : "▼"}${Math.abs(((yoyDiff)/prior)*100).toFixed(0)}%</span>`
      : "—";
    const txId = `bva-${i}`;
    html += `<tr class="has-drill" data-drill="${txId}">
      <td style="padding-left:1.5rem">${row.account}</td>
      <td>${row.name}</td><td></td>
      <td class="num">${row.budget > 0 ? fmt(row.budget) : "—"}</td>
      <td class="num">${fmt(row.actual)}</td>
      <td class="num">${yoyStr}</td>
      <td class="num ${row.variance >= 0 ? "pos":"neg"}">${fmt(row.variance)}</td>
      <td>
        <div class="progress-wrap">
          <div class="progress-bg"><div class="progress-fill ${row.status}" style="width:${fillPct}%"></div></div>
        </div>
        <span style="font-size:.72rem;margin-left:.4rem">${pct(row.variancePct)}</span>
      </td>
      <td><span class="badge ${row.status}">${
        row.status === "green"  ? "On Track" :
        row.status === "yellow" ? "Watch"    :
        row.status === "red"    ? "Over"     : "N/A"
      }</span></td>
    </tr>`;
    // Drill-down: transactions come pre-aggregated from the worker rollup
    (row.transactions ?? []).forEach(t => {
      const srcLabel = t.sourceAccountName && t.sourceAccountName !== row.name
        ? ` <em style="font-size:.7rem">[${t.sourceAccount} ${t.sourceAccountName}]</em>`
        : "";
      html += `<tr class="drill-row" id="${txId}">
        <td></td><td>${fmtDate(t.date)} — ${t.memo ?? ""} ${t.vendor ? `· <em>${t.vendor}</em>` : ""}${srcLabel}</td>
        <td colspan="7" class="num">${fmt(t.amount)}</td>
      </tr>`;
    });
  });

  html += `</tbody></table></div>`;
  document.getElementById("budget-content").innerHTML = html;
  attachDrill();
}

// ── Giving by Fund ────────────────────────────────────────────────────────────
function renderGiving() {
  const rows = [...(DATA.givingByFund ?? [])].sort((a, b) => b.total - a.total);
  const total = rows.reduce((s, r) => s + r.total, 0);

  let html = `<h2 class="section-title" style="margin-top:1.5rem">Giving by Fund / Purpose</h2>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:1rem">
      Donor names are not shown. Figures reflect contributions recorded by fund designation.
    </p>
    <div class="table-wrap"><table>
    <thead><tr>
      <th>Fund / Purpose</th><th class="num">Amount</th><th class="num">% of Total</th>
    </tr></thead><tbody>`;

  rows.forEach(r => {
    const share = total > 0 ? r.total / total : 0;
    html += `<tr>
      <td>${r.fund}</td>
      <td class="num">${fmt(r.total)}</td>
      <td class="num">
        <div class="progress-wrap"><div class="progress-bg">
          <div class="progress-fill green" style="width:${clamp(share*100,0,100)}%"></div>
        </div></div>
        <span style="font-size:.72rem;margin-left:.4rem">${pct(share)}</span>
      </td>
    </tr>`;
  });

  html += `<tr><td><strong>Total Giving</strong></td>
    <td class="num pos"><strong>${fmt(total)}</strong></td>
    <td class="num">100%</td></tr>
    </tbody></table></div>`;

  document.getElementById("giving-content").innerHTML = html;
}

// ── Reserves ──────────────────────────────────────────────────────────────────
function renderReserves() {
  const funds = [...(DATA.funds ?? [])].sort((a, b) => b.balance - a.balance);
  const unrestricted = funds.filter(f => f.type !== "restricted");
  const restricted   = funds.filter(f => f.type === "restricted");

  function fundCards(list) {
    return `<div class="fund-grid">${list.map(f => `
      <div class="fund-card">
        <div class="fund-type">${f.type ?? "fund"}</div>
        <div class="fund-name">${f.name}</div>
        <div class="fund-balance ${f.balance < 0 ? "neg" : ""}">${fmt(f.balance)}</div>
      </div>`).join("")}</div>`;
  }

  document.getElementById("reserves-content").innerHTML = `
    <h2 class="section-title" style="margin-top:1.5rem">Unrestricted Reserves</h2>
    ${fundCards(unrestricted)}
    <h2 class="section-title" style="margin-top:1.5rem">Restricted Funds</h2>
    ${fundCards(restricted)}
  `;
}

// ── Transaction Register ──────────────────────────────────────────────────────
function renderRegister() {
  registerData = [...(DATA.register ?? [])];

  // Populate fund filter
  const funds = [...new Set(registerData.map(r => r.fund))].sort();
  const fundSel = document.getElementById("reg-fund");
  fundSel.innerHTML = `<option value="">All funds</option>` +
    funds.map(f => `<option value="${f}">${f}</option>`).join("");

  // Bind filters
  document.getElementById("reg-search").addEventListener("input", filterRegister);
  document.getElementById("reg-type").addEventListener("change", filterRegister);
  fundSel.addEventListener("change", filterRegister);

  filterRegister();
}

function filterRegister() {
  const q    = document.getElementById("reg-search").value.toLowerCase();
  const type = document.getElementById("reg-type").value;
  const fund = document.getElementById("reg-fund").value;

  const filtered = registerData.filter(r => {
    const text = [r.memo, r.fund, r.account, r.vendor].filter(Boolean).join(" ").toLowerCase();
    return (!q || text.includes(q)) && (!type || r.type === type) && (!fund || r.fund === fund);
  }).slice(0, 500);

  document.getElementById("reg-count").textContent = `${filtered.length} transactions`;

  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th>Date</th><th>Memo</th><th>Vendor</th><th>Fund</th>
      <th>Account</th><th>Type</th><th class="num">Amount</th>
    </tr></thead><tbody>`;

  filtered.forEach(r => {
    html += `<tr>
      <td style="white-space:nowrap">${fmtDate(r.date)}</td>
      <td>${r.memo ?? "—"}</td>
      <td>${r.vendor ?? "—"}</td>
      <td>${r.fund}</td>
      <td>${r.account}</td>
      <td><span class="badge ${r.type === "income" ? "green" : "none"}">${r.type}</span></td>
      <td class="num ${r.type === "income" ? "pos" : ""}">${fmt(r.amount)}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  document.getElementById("register-content").innerHTML = html;
}

// ── Drill-down toggle ─────────────────────────────────────────────────────────
function attachDrill() {
  document.querySelectorAll(".has-drill").forEach(row => {
    row.removeEventListener("click", drillHandler);
    row.addEventListener("click", drillHandler);
  });
}

function drillHandler(e) {
  const id = this.dataset.drill;
  const open = this.classList.toggle("open");
  document.querySelectorAll(`.drill-row#${id}`).forEach(r => r.classList.toggle("open", open));
}
</script>
</body>
</html>
